name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write DB config
        env:
          DB_HOST: localhost
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          php -r 'file_put_contents("public/db_config.php", "<?php\nreturn " . var_export([
            "host" => getenv("DB_HOST"),
            "name" => getenv("DB_NAME"),
            "user" => getenv("DB_USER"),
            "pass" => getenv("DB_PASS"),
            "backup_token" => getenv("BACKUP_TOKEN"),
          ], true) . ";\n");'
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Host cert is *.varialhosting.com, not cards.kuzub.com
          security: loose
          local-dir: ./public/
          server-dir: ./
