<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-27 UD Tim Hortons Hockey Checklist</title>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --text-color: #222;
            --muted: #6b7280;
            --primary: #c8102e;
            --row-single: #e8f5e9;
            --row-single-edge: #81c784;
            --row-double: #fff9c4;
            --row-double-edge: #fbc02d;
            --trade: #1565c0;
            --border-color: #e0e0e0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            font-size: 14px;
        }

        /* Sticky top bar */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
        }
        .bar {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }
        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.05rem;
            margin-right: auto;
        }
        select, button, input {
            font: inherit;
            font-size: 0.85rem;
        }
        select, input {
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
        }
        button {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .filters { display: flex; gap: 4px; }
        .filters button.active { background: var(--text-color); border-color: var(--text-color); color: #fff; }
        .overall { font-size: 0.8rem; color: var(--muted); }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 8px 12px 40px;
        }
        .notice {
            background: #fff;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            color: var(--muted);
        }

        /* Set sections */
        details.set {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 8px;
        }
        details.set > summary {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 600;
            list-style: none;
        }
        details.set > summary::-webkit-details-marker { display: none; }
        details.set > summary::before { content: "▸"; color: var(--muted); }
        details.set[open] > summary::before { content: "▾"; }
        .set-count { font-weight: normal; font-size: 0.8rem; color: var(--muted); }
        .progress {
            flex: 0 0 80px;
            height: 5px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin-left: auto;
        }
        .progress > span { display: block; height: 100%; background: var(--row-single-edge); }

        /* Card tiles */
        /* Cards read top-to-bottom, column by column, in groups of 9 with a gap between groups */
        .grid {
            column-width: 190px;
            column-gap: 12px;
            padding: 0 6px 8px;
        }
        .group {
            display: grid;
            gap: 3px;
            break-inside: avoid;
            margin-bottom: 12px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            border: 1px solid transparent;
            border-left: 3px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            user-select: none;
            min-width: 0;
        }
        .card:hover { border-color: var(--border-color); }
        .readonly .card { cursor: default; }
        .need {
            flex: 0 0 auto;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 0 4px;
        }
        .card.collected { background: var(--row-single); border-left-color: var(--row-single-edge); }
        .card.doubles { background: var(--row-double); border-left-color: var(--row-double-edge); }
        .num { flex: 0 0 auto; min-width: 2.6em; font-weight: 700; font-size: 0.75rem; color: var(--muted); }
        .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qty { flex: 0 0 auto; font-size: 0.7rem; font-weight: 700; }
        .collected .qty { color: #2e7d32; }
        .doubles .qty { color: #f57f17; }
        .trade {
            flex: 0 0 auto;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            background: var(--trade);
            border-radius: 8px;
            padding: 0 5px;
        }
        .trade-names {
            grid-column: 1 / -1;
            font-size: 0.75rem;
            color: var(--trade);
            padding: 0 6px 0 calc(2.6em + 15px);
            margin-top: -2px;
        }

        dialog {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            width: min(320px, 90vw);
        }
        dialog form { display: grid; gap: 8px; }
        dialog label { display: grid; gap: 3px; font-size: 0.8rem; color: var(--muted); }
        dialog .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
        .error { color: var(--primary); font-size: 0.8rem; min-height: 1em; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            background: var(--text-color);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 20;
        }
        /* Phones zoom into inputs smaller than 16px */
        dialog input, dialog select { font-size: 16px; }
        @media (max-width: 600px) {
            header { padding: 6px 10px; }
            h1 { font-size: 0.95rem; }
            .card { padding: 6px; }
        }
    </style>
</head>
<body>

<header>
    <div class="bar">
        <h1>2026-27 UD Tim Hortons Checklist</h1>
        <span class="overall" id="who"></span>
        <button id="signInBtn" class="primary">Sign in</button>
        <button id="signOutBtn" hidden>Sign out</button>
        <button id="newUserBtn">+ Collector</button>
        <label class="overall">Viewing <select id="viewSelect" aria-label="Viewing collection"></select></label>
        <div class="filters" id="filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="missing">Missing</button>
            <button data-filter="doubles">My Doubles</button>
            <button data-filter="trade" title="Cards you're missing that other collectors have doubles of">For Trade</button>
        </div>
        <span class="overall" id="overall"></span>
    </div>
</header>

<main id="main"></main>
<div class="toast" id="toast" hidden></div>

<dialog id="userDialog">
    <form id="userForm">
        <strong>New collector</strong>
        <label>Collector name (shown to other traders)
            <input name="collector_name" maxlength="50" minlength="2" required autocomplete="off">
        </label>
        <label>Initials (secret — you sign in with these)
            <input name="initials" type="password" maxlength="5" required pattern="[A-Za-z]{1,5}" autocomplete="new-password">
        </label>
        <div class="error" id="userError"></div>
        <div class="actions">
            <button type="button" id="cancelUser">Cancel</button>
            <button type="submit" class="primary">Create</button>
        </div>
    </form>
</dialog>

<dialog id="signInDialog">
    <form id="signInForm">
        <strong>Sign in</strong>
        <label>Collector
            <select name="user_id" id="signInUser" required></select>
        </label>
        <label>Initials
            <input name="initials" type="password" maxlength="5" required autocomplete="current-password">
        </label>
        <div class="error" id="signInError"></div>
        <div class="actions">
            <button type="button" id="cancelSignIn">Cancel</button>
            <button type="submit" class="primary">Sign in</button>
        </div>
    </form>
</dialog>

<script>
    const state = {
        users: [],
        userId: null,   // the signed-in collector (me)
        initials: null, // my secret, sent with every change
        viewId: null,   // whose collection is shown
        cards: [],
        filter: 'all',
        collapsed: new Set(),
    };

    function store(key, value) {
        try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch (e) {}
    }
    function recall(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }

    let toastTimer;
    function toast(message) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.hidden = true, 3000);
    }

    async function api(action, params = {}, body = null) {
        const query = new URLSearchParams({ action, ...params });
        const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
        const response = await fetch(`api.php?${query}`, opts);
        const data = await response.json();
        if (data && data.error) throw new Error(data.error);
        return data;
    }

    async function loadUsers() {
        state.users = await api('get_users');
        const savedId = Number(recall('collectorId'));
        const savedInitials = recall('collectorInitials');
        if (savedId && savedInitials) {
            try {
                await api('login', {}, { user_id: savedId, initials: savedInitials });
                setSignedIn(savedId, savedInitials);
            } catch (e) {
                setSignedIn(null, null);
            }
        }
        state.viewId = state.viewId ?? state.userId ?? state.users[0]?.id ?? null;
        renderUserSelect();
    }

    function setSignedIn(userId, initials) {
        state.userId = userId;
        state.initials = initials;
        state.viewId = userId;
        store('collectorId', userId);
        store('collectorInitials', initials);
    }

    function renderUserSelect() {
        const me = state.users.find(u => u.id === state.userId);
        document.getElementById('who').innerHTML = me ? `Signed in as <strong>${esc(me.collector_name)}</strong>` : '';
        document.getElementById('signInBtn').hidden = !!me;
        document.getElementById('signOutBtn').hidden = !me;

        const view = document.getElementById('viewSelect');
        view.innerHTML = state.users
            .map(u => `<option value="${u.id}">${u.id === state.userId ? 'My collection' : esc(u.collector_name)}</option>`)
            .join('');
        if (!state.viewId) view.insertAdjacentHTML('afterbegin', '<option value="">—</option>');
        view.value = state.viewId ?? '';
    }

    function isOwn() {
        return state.userId !== null && state.viewId === state.userId;
    }

    function viewedName() {
        return state.users.find(u => u.id === state.viewId)?.collector_name ?? '';
    }

    async function loadCards() {
        const params = {};
        if (state.viewId) params.user_id = state.viewId;
        if (state.userId) params.me = state.userId;
        state.cards = await api('get_cards', params);
        render();
    }

    function matchesFilter(card) {
        switch (state.filter) {
            case 'missing': return card.quantity == 0;
            case 'doubles': return card.quantity >= 2;
            case 'trade': return isOwn()
                ? card.quantity == 0 && card.doubles_by.length > 0
                : card.quantity >= 2 && (!state.userId || card.my_quantity == 0);
            default: return true;
        }
    }

    function render() {
        const main = document.getElementById('main');
        const sets = new Map();
        for (const card of state.cards) {
            if (!sets.has(card.set_name)) sets.set(card.set_name, []);
            sets.get(card.set_name).push(card);
        }

        const owned = state.cards.filter(c => c.quantity > 0).length;
        document.getElementById('overall').textContent = state.viewId ? `${owned}/${state.cards.length} collected` : '';
        main.classList.toggle('readonly', !isOwn());

        let html = '';
        if (!state.userId) {
            html += '<div class="notice"><strong>Sign in</strong> or create a collector with <strong>+ Collector</strong> to start checking off cards.</div>';
        }
        if (state.viewId && !isOwn()) {
            html += `<div class="notice">Viewing <strong>${esc(viewedName())}</strong>'s collection (read-only).`
                + (state.userId ? ' Cards marked <span class="need">NEED</span> are their doubles you\'re missing.' : '')
                + '</div>';
        }
        for (const [setName, cards] of sets) {
            const visible = cards.filter(matchesFilter);
            if (!visible.length && state.filter !== 'all') continue;
            // Groups of 9 follow each card's position in the set, so filtering keeps cards in their group
            const groups = [];
            cards.forEach((card, i) => {
                if (!matchesFilter(card)) return;
                (groups[Math.floor(i / 9)] ??= []).push(card);
            });
            const have = cards.filter(c => c.quantity > 0).length;
            const pct = Math.round(have / cards.length * 100);
            const open = state.collapsed.has(setName) ? '' : ' open';
            html += `<details class="set" data-set="${esc(setName)}"${open}>
                <summary>${esc(setName)} <span class="set-count">${have}/${cards.length}</span>
                    <span class="progress"><span style="width:${pct}%"></span></span></summary>
                <div class="grid">${groups.filter(Boolean).map(g => `<div class="group">${g.map(renderCard).join('')}</div>`).join('')}</div>
            </details>`;
        }
        if (!html) html = '<div class="notice">Nothing here yet.</div>';
        main.innerHTML = html;
    }

    function renderCard(card) {
        const cls = card.quantity >= 2 ? 'doubles' : card.quantity == 1 ? 'collected' : '';
        const qty = card.quantity >= 2 ? '2x' : card.quantity == 1 ? '✓' : '';
        const traders = card.doubles_by;
        const title = [card.player_name, card.last_checked ? `Checked ${card.last_checked}` : '',
            traders.length ? `Doubles: ${traders.join(', ')}` : ''].filter(Boolean).join('\n');
        let html = `<div class="card ${cls}" data-id="${card.id}" title="${esc(title)}">
            <span class="num">${esc(card.card_number)}</span>
            <span class="name">${esc(card.player_name)}</span>
            ${isOwn() && traders.length ? `<span class="trade">⇄${traders.length}</span>` : ''}
            ${!isOwn() && state.userId && card.quantity >= 2 && card.my_quantity == 0 ? '<span class="need">NEED</span>' : ''}
            <span class="qty">${qty}</span>
        </div>`;
        if (state.filter === 'trade' && isOwn()) {
            html += `<div class="trade-names">from ${traders.map(esc).join(', ')}</div>`;
        }
        return html;
    }

    async function toggleCard(cardId) {
        if (!state.userId) {
            openSignIn();
            return;
        }
        if (!isOwn()) {
            toast(`This is ${viewedName()}'s collection — switch Viewing to My collection to edit`);
            return;
        }
        let data;
        try {
            data = await api('toggle_card', {}, { user_id: state.userId, initials: state.initials, card_id: cardId });
        } catch (err) {
            toast(err.message);
            return;
        }
        const card = state.cards.find(c => c.id === cardId);
        card.quantity = data.quantity;
        card.last_checked = data.last_checked;
        render();
    }

    document.getElementById('main').addEventListener('click', e => {
        const tile = e.target.closest('.card');
        if (tile) toggleCard(Number(tile.dataset.id));
    });
    document.getElementById('main').addEventListener('toggle', e => {
        const set = e.target.dataset.set;
        if (!set) return;
        e.target.open ? state.collapsed.delete(set) : state.collapsed.add(set);
    }, true);

    document.getElementById('filters').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        state.filter = btn.dataset.filter;
        document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b === btn));
        render();
    });

    const signInDialog = document.getElementById('signInDialog');
    const signInForm = document.getElementById('signInForm');
    function openSignIn() {
        signInForm.reset();
        document.getElementById('signInUser').innerHTML = state.users
            .map(u => `<option value="${u.id}">${esc(u.collector_name)}</option>`).join('');
        document.getElementById('signInError').textContent = '';
        signInDialog.showModal();
    }
    document.getElementById('signInBtn').onclick = openSignIn;
    document.getElementById('cancelSignIn').onclick = () => signInDialog.close();
    signInForm.addEventListener('submit', async e => {
        e.preventDefault();
        const userId = Number(signInForm.user_id.value);
        const initials = signInForm.initials.value.trim().toUpperCase();
        try {
            await api('login', {}, { user_id: userId, initials });
            setSignedIn(userId, initials);
            renderUserSelect();
            signInDialog.close();
            loadCards();
        } catch (err) {
            document.getElementById('signInError').textContent = err.message;
        }
    });
    document.getElementById('signOutBtn').onclick = () => {
        setSignedIn(null, null);
        state.viewId = state.users[0]?.id ?? null;
        renderUserSelect();
        loadCards();
    };

    document.getElementById('viewSelect').addEventListener('change', e => {
        state.viewId = e.target.value ? Number(e.target.value) : null;
        loadCards();
    });

    const dialog = document.getElementById('userDialog');
    const form = document.getElementById('userForm');
    document.getElementById('newUserBtn').onclick = () => {
        form.reset();
        document.getElementById('userError').textContent = '';
        dialog.showModal();
    };
    document.getElementById('cancelUser').onclick = () => dialog.close();
    form.addEventListener('submit', async e => {
        e.preventDefault();
        const fields = Object.fromEntries(new FormData(form));
        try {
            const user = await api('create_user', {}, fields);
            state.users.push(user);
            state.users.sort((a, b) => a.collector_name.localeCompare(b.collector_name));
            setSignedIn(user.id, fields.initials.trim().toUpperCase());
            renderUserSelect();
            dialog.close();
            loadCards();
        } catch (err) {
            document.getElementById('userError').textContent = err.message;
        }
    });

    loadUsers().then(loadCards).catch(err => toast(`Couldn't load: ${err.message}`));
</script>

</body>
</html>
